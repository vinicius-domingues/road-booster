<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road-Booster</title>
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="splash-screen">
    <div class="splash-logo">
      <svg viewBox="0 0 100 100" class="splash-svg">
        <circle cx="50" cy="50" r="45" fill="none" stroke="var(--color-3b82f6)" stroke-width="4" stroke-dasharray="283" stroke-dashoffset="283" class="draw-circle" />
        <path d="M50 20 L50 80 M20 50 L80 50" stroke="var(--color-06b6d4)" stroke-width="4" class="draw-cross" />
        <circle cx="50" cy="50" r="10" fill="var(--color-10b981)" class="pop-dot" />
      </svg>
      <h2>Road-Booster</h2>
    </div>
  </div>

  <div id="app"></div>

  <script src="script.js"></script>
</body>
</html>
